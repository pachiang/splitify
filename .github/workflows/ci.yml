name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  database:
    name: Migrations / RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d splitify -v ON_ERROR_STOP=1 -q
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # 純 Postgres 沒有 Supabase 的 auth / storage schema,先補上等價物件。
      - name: Stub Supabase platform objects
        run: $PSQL -f supabase/tests/00_platform_stub.sql

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            $PSQL -f "$f"
          done

      # 斷言失敗會 raise exception,讓這一步失敗。
      - name: RLS isolation tests
        run: $PSQL -f supabase/tests/10_rls.sql
